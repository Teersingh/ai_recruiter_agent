# Runs only PostgreSQL. The API and UI run on your machine for easy debugging.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: recruiter
      POSTGRES_PASSWORD: recruiter
      POSTGRES_DB: recruiter
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
